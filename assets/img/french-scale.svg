<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" class="dg">
<style>
.dg text{font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;fill:var(--ink-2,#4E5B67)}
.dg .th{fill:var(--ink,#17222D);font-weight:700}
.dg .sm{font-size:13px}
.dg .ink{stroke:var(--ink,#17222D);fill:none}
.dg .inkf{fill:var(--ink,#17222D)}
.dg .rule{stroke:var(--rule-2,#C4CCD4);fill:none}
.dg .sunk{fill:var(--sunk,#E7EBEF)}
.dg .sheet{fill:var(--sheet,#FFFFFF)}
.dg .wall{stroke:var(--artery,#B01E2E);fill:none}
.dg .lumen{fill:var(--artery-tint,#FBEEEF)}
.dg .tube-o{stroke:var(--artery,#B01E2E);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .tube-i{stroke:var(--artery-tint,#FBEEEF);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .artf{fill:var(--artery,#B01E2E)}
.dg .artl{stroke:var(--artery,#B01E2E);fill:none}
.dg .graft{stroke:var(--pearl,#0B7559);fill:var(--pearl-tint,#E7F4EE)}
.dg .graftl{stroke:var(--pearl,#0B7559);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .graftf{fill:var(--pearl,#0B7559)}
.dg .clot{fill:var(--mnem,#8A5A00);fill-opacity:.8}
.dg .vein{stroke:var(--vein,#23539E);fill:none}
.dg .veinf{fill:var(--vein,#23539E)}
.dg .dev{stroke:var(--tip,#583D96);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .devf{fill:var(--tip,#583D96)}
.dg .ghost{stroke:var(--rule-2,#C4CCD4);fill:none;stroke-dasharray:6 6;stroke-linecap:round}
</style>
<text x="30" y="176" class="sm">size</text><text x="30" y="194" class="sm">mm</text>
<text x="30" y="30" class="th">Catheters and sheaths, drawn to scale (French)</text>
<circle cx="91.3" cy="110" r="7.3" class="lumen"/><circle cx="91.3" cy="110" r="7.3" class="wall" stroke-width="2"/>
<text x="91.3" y="176" text-anchor="middle" class="th sm">4F</text>
<text x="91.3" y="194" text-anchor="middle" class="sm">1.3</text>
<circle cx="131.8" cy="110" r="9.2" class="lumen"/><circle cx="131.8" cy="110" r="9.2" class="wall" stroke-width="2"/>
<text x="131.8" y="176" text-anchor="middle" class="th sm">5F</text>
<text x="131.8" y="194" text-anchor="middle" class="sm">1.7</text>
<circle cx="176.0" cy="110" r="11.0" class="lumen"/><circle cx="176.0" cy="110" r="11.0" class="wall" stroke-width="2"/>
<text x="176.0" y="176" text-anchor="middle" class="th sm">6F</text>
<text x="176.0" y="194" text-anchor="middle" class="sm">2.0</text>
<circle cx="223.8" cy="110" r="12.8" class="lumen"/><circle cx="223.8" cy="110" r="12.8" class="wall" stroke-width="2"/>
<text x="223.8" y="176" text-anchor="middle" class="th sm">7F</text>
<text x="223.8" y="194" text-anchor="middle" class="sm">2.3</text>
<circle cx="275.3" cy="110" r="14.7" class="lumen"/><circle cx="275.3" cy="110" r="14.7" class="wall" stroke-width="2"/>
<text x="275.3" y="176" text-anchor="middle" class="th sm">8F</text>
<text x="275.3" y="194" text-anchor="middle" class="sm">2.7</text>
<circle cx="332.3" cy="110" r="18.3" class="lumen"/><circle cx="332.3" cy="110" r="18.3" class="wall" stroke-width="2"/>
<text x="332.3" y="176" text-anchor="middle" class="th sm">10F</text>
<text x="332.3" y="194" text-anchor="middle" class="sm">3.3</text>
<circle cx="396.7" cy="110" r="22.0" class="lumen"/><circle cx="396.7" cy="110" r="22.0" class="wall" stroke-width="2"/>
<text x="396.7" y="176" text-anchor="middle" class="th sm">12F</text>
<text x="396.7" y="194" text-anchor="middle" class="sm">4.0</text>
<circle cx="468.3" cy="110" r="25.7" class="lumen"/><circle cx="468.3" cy="110" r="25.7" class="wall" stroke-width="2"/>
<text x="468.3" y="176" text-anchor="middle" class="th sm">14F</text>
<text x="468.3" y="194" text-anchor="middle" class="sm">4.7</text>
<circle cx="551.0" cy="110" r="33.0" class="lumen"/><circle cx="551.0" cy="110" r="33.0" class="wall" stroke-width="2"/>
<text x="551.0" y="176" text-anchor="middle" class="th sm">18F</text>
<text x="551.0" y="194" text-anchor="middle" class="sm">6.0</text>
<circle cx="644.7" cy="110" r="36.7" class="lumen"/><circle cx="644.7" cy="110" r="36.7" class="wall" stroke-width="2"/>
<text x="644.7" y="176" text-anchor="middle" class="th sm">20F</text>
<text x="644.7" y="194" text-anchor="middle" class="sm">6.7</text>
<circle cx="749.3" cy="110" r="44.0" class="lumen"/><circle cx="749.3" cy="110" r="44.0" class="wall" stroke-width="2"/>
<text x="749.3" y="176" text-anchor="middle" class="th sm">24F</text>
<text x="749.3" y="194" text-anchor="middle" class="sm">8.0</text>
<text x="30" y="246" class="th">Guidewires, same scale (inches)</text>
<circle cx="40" cy="280" r="1.96" class="devf"/>
<text x="58" y="285" class="sm"><tspan class="th">0.014"</tspan> = 0.36 mm ≈ 1.1F</text>
<circle cx="226" cy="280" r="2.51" class="devf"/>
<text x="244" y="285" class="sm"><tspan class="th">0.018"</tspan> = 0.46 mm ≈ 1.4F</text>
<circle cx="412" cy="280" r="4.89" class="devf"/>
<text x="430" y="285" class="sm"><tspan class="th">0.035"</tspan> = 0.89 mm ≈ 2.7F</text>
<circle cx="598" cy="280" r="5.31" class="devf"/>
<text x="616" y="285" class="sm"><tspan class="th">0.038"</tspan> = 0.97 mm ≈ 2.9F</text>
<text x="30" y="330" class="sm">French ÷ 3 = millimeters. A sheath is sized by the catheter it accepts (inner diameter);</text>
<text x="30" y="350" class="sm">its outer diameter, which is the hole in the artery, is larger. A catheter is sized by its outer diameter.</text>
</svg>
