<text x="388" y="30" text-anchor="start" class="sm">inferior epigastric</text>
<text x="330" y="120" text-anchor="start" class="th sm">Too high: above the ligament,</text>
<text x="330" y="138" text-anchor="start" class="sm">bleeding into the retroperitoneum</text>
<text x="312" y="206" text-anchor="start" class="th sm">Target: common femoral artery</text>
<text x="312" y="224" text-anchor="start" class="sm">over the middle of the femoral head</text>
<text x="300" y="302" text-anchor="start" class="th sm">Too low: at or past the bifurcation,</text>
<text x="300" y="320" text-anchor="start" class="sm">pseudoaneurysm or AV fistula</text>
<text x="284" y="440" text-anchor="start" class="sm">SFA</text>
<text x="186" y="440" text-anchor="end" class="sm">profunda</text>
