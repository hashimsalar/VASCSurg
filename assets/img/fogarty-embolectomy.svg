<circle cx="22" cy="160" r="13" class="inkf"/>
<text x="22" y="165" text-anchor="middle" class="th" style="fill:var(--sheet,#fff)">2</text>
<text x="148" y="165">Inflate the balloon gently, just enough to touch the wall</text>
<rect x="40" y="314" width="640" height="48" class="lumen"/>
<line x1="40" y1="314" x2="96" y2="314" class="wall" stroke-width="4"/>
<line x1="124" y1="314" x2="680" y2="314" class="wall" stroke-width="4"/>
<line x1="40" y1="362" x2="680" y2="362" class="wall" stroke-width="4"/>
<path d="M150,318 C185,316 225,322 268,318 L268,358 C230,360 190,356 150,358 C138,346 138,330 150,318 Z" class="clot"/>
<path d="M110,274 C110,308 116,338 160,338 L272,338" class="dev" stroke-width="4"/>
<ellipse cx="292" cy="338" rx="24" ry="21" class="devf" fill-opacity=".85"/>
<line x1="400" y1="338" x2="330" y2="338" class="ink" stroke-width="2.5" marker-end="url(#fg-a)"/>
<circle cx="22" cy="288" r="13" class="inkf"/>
<text x="22" y="293" text-anchor="middle" class="th" style="fill:var(--sheet,#fff)">3</text>
<text x="148" y="293">Withdraw steadily: the clot comes out ahead of the balloon</text>
<text x="110" y="126" text-anchor="middle" class="sm">arteriotomy</text>
<text x="400" y="126" text-anchor="middle" class="sm">clot</text>
</svg>
