.dg .sheet{fill:var(--sheet,#FFFFFF)}
.dg .wall{stroke:var(--artery,#B01E2E);fill:none}
.dg .lumen{fill:var(--artery-tint,#FBEEEF)}
.dg .tube-o{stroke:var(--artery,#B01E2E);fill:none;stroke-linecap:round;stroke-linejoin:round}
